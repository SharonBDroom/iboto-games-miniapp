<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>iBoto Games Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#0f1720; --card:#192635; --card2:#213346; --line:#30475c; --text:#e8f4fd; --muted:#8bacc8;
      --accent:#55c8ff; --good:#44d67f; --warn:#ffd166; --bad:#ff6b6b; --dark:#52616f; --light:#d9e2ec;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:980px;margin:0 auto;padding:14px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .col{display:flex;flex-direction:column;gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
    .grow{flex:1 1 320px}
    h1,h2,h3,p{margin:0}
    .muted{color:var(--muted)}
    .btn,.input,.select{border-radius:12px;border:1px solid var(--line);padding:11px 12px;background:var(--card2);color:var(--text);font-size:15px}
    .btn{cursor:pointer;font-weight:700}
    .btn.primary{background:var(--accent);color:#08212d;border-color:#79d8ff}
    .btn.good{background:var(--good);color:#072915;border-color:#5ae892}
    .btn.warn{background:var(--warn);color:#382700;border-color:#ffe08a}
    .btn.bad{background:var(--bad);color:white;border-color:#ff9a9a}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .players{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
    .player{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px}
    .avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#101820;border:1px solid var(--line)}
    .avatar.ph{display:flex;align-items:center;justify-content:center;font-weight:700}
    .pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:#253748;border:1px solid var(--line);font-size:12px}
    .grid3{display:grid;grid-template-columns:repeat(3,84px);gap:8px;justify-content:center}
    .cell{width:84px;height:84px;font-size:30px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer}
    .grid4{display:grid;grid-template-columns:repeat(4,70px);gap:8px;justify-content:center}
    .mem{width:70px;height:70px;font-size:27px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer}
    .grid8{display:grid;grid-template-columns:repeat(8,42px);gap:0;justify-content:center;width:max-content;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .sq{width:42px;height:42px;border:none;font-size:22px;cursor:pointer}
    .sq.light{background:var(--light);color:#000}
    .sq.dark{background:var(--dark);color:white}
    .sq.sel{outline:3px solid var(--warn);outline-offset:-3px}
    .sq.target{outline:3px solid var(--good);outline-offset:-3px}
    .chatbox{height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
    .msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
    .msg.me{border-color:#5cb8d8}
    .small{font-size:12px}
    .mono{font-family:Consolas,monospace}
    .hidden{display:none !important}
    .err{color:#ffb3b3}
  </style>
</head>
<body>
<div class="app">
  <div class="card" style="margin-bottom:12px">
    <h1>🎮 iBoto Games Mini App</h1>
    <p class="muted">Shared rooms from Telegram • Tic-Tac-Toe • Memory Match • Checkers • room chat</p>
  </div>

  <div class="row">
    <div class="card grow col">
      <h2>Backend</h2>
      <div class="toolbar">
        <input id="apiBaseInput" class="input" placeholder="https://your-api-tunnel.trycloudflare.com" />
        <button id="btnSaveApi" class="btn">Save Backend URL</button>
      </div>
      <div id="apiStatus" class="small muted"></div>
      <div id="apiError" class="small err"></div>
    </div>

    <div class="card grow col">
      <h2>Room</h2>
      <div class="toolbar">
        <select id="gameSelect" class="select">
          <option value="ttt">Tic-Tac-Toe</option>
          <option value="memory">Memory Match</option>
          <option value="checkers">Checkers</option>
        </select>
        <input id="groupIdInput" class="input" placeholder="Group ID" />
        <button id="btnCreate" class="btn primary">Create Room</button>
      </div>
      <div class="toolbar">
        <input id="roomInput" class="input mono" placeholder="Room ID" />
        <button id="btnJoin" class="btn good">Join Room</button>
        <button id="btnRefresh" class="btn">Refresh</button>
        <button id="btnShare" class="btn warn">Copy Room Link</button>
      </div>
      <div class="small muted">Supports start params like <span class="mono">ttt_g_-100123</span>, <span class="mono">memory_g_-100123</span>, <span class="mono">checkers_g_-100123</span>, <span class="mono">all_g_-100123</span>, <span class="mono">r_roomid</span>.</div>
      <div id="roomMeta" class="small muted"></div>
    </div>

    <div class="card grow col">
      <h2>Players</h2>
      <div id="players" class="players"></div>
    </div>
  </div>

  <div class="row" style="margin-top:12px">
    <div class="card grow col">
      <h2 id="gameTitle">Game</h2>
      <div id="status" class="muted"></div>
      <div id="boardWrap"></div>
    </div>

    <div class="card grow col">
      <h2>Chat</h2>
      <div id="chatBox" class="chatbox"></div>
      <div class="toolbar">
        <input id="chatInput" class="input" placeholder="Type a message..." />
        <button id="btnSend" class="btn primary">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp || null;
if (tg) {
  try {
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes?.();
  } catch(e){}
}

const STORAGE_API_KEY = "IBOTO_MINIAPP_API_BASE";
const STORAGE_DEV_USER_KEY = "IBOTO_MINIAPP_DEV_USER";

function el(id){ return document.getElementById(id); }
function h(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nowTs(){ return Math.floor(Date.now()/1000); }

const state = {
  me: null,
  room: null,
  pollTimer: null,
  startParam: null,
  apiBase: ""
};

function normalizeBase(u){
  return String(u || "").trim().replace(/\/+$/, "");
}

function getStartParam(){
  const tgParam = tg?.initDataUnsafe?.start_param || null;
  if (tgParam) return tgParam;
  const qs = new URLSearchParams(location.search);
  return qs.get("startapp") || qs.get("tgWebAppStartParam") || null;
}

function resolveApiBase(){
  const qs = new URLSearchParams(location.search);
  const q = normalizeBase(qs.get("api") || "");
  if (q) {
    localStorage.setItem(STORAGE_API_KEY, q);
    return q;
  }

  const saved = normalizeBase(localStorage.getItem(STORAGE_API_KEY) || "");
  if (saved) return saved;

  // If page is served from the backend itself, same origin works.
  if (location.origin && !location.origin.includes("github.io")) {
    return normalizeBase(location.origin);
  }

  return "";
}

function setApiStatus(){
  el("apiBaseInput").value = state.apiBase || "";
  el("apiStatus").innerHTML = state.apiBase
    ? `Backend API: <span class="mono">${h(state.apiBase)}</span>`
    : `No backend URL configured yet.`;
  el("apiError").textContent = state.apiBase ? "" : "Set your backend HTTPS tunnel URL first.";
}

async function api(path, opts = {}){
  if (!state.apiBase) {
    throw new Error("Backend API URL is not configured");
  }

  const url = state.apiBase + path;
  const resp = await fetch(url, {
    headers: { "Content-Type": "application/json" },
    ...opts
  });

  const raw = await resp.text();
  let data = {};
  try { data = raw ? JSON.parse(raw) : {}; } catch(e) { data = {}; }

  if (!resp.ok || data.ok === false) {
    throw new Error(data.error || raw || ("HTTP " + resp.status));
  }
  return data;
}

function getDevUser(){
  try {
    const raw = localStorage.getItem(STORAGE_DEV_USER_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Number(parsed.id) > 0) return parsed;
    }
  } catch(e){}

  const uid = Math.floor(100000000 + Math.random() * 900000000);
  const dev = {
    id: uid,
    username: "local_debug_user",
    first_name: "Local",
    last_name: "Debug",
    display_name: "Local Debug",
    photo_url: "",
    premium: false
  };
  localStorage.setItem(STORAGE_DEV_USER_KEY, JSON.stringify(dev));
  return dev;
}

function getTelegramUser(){
  const u = tg?.initDataUnsafe?.user;
  if (u) {
    return {
      id: Number(u.id || 0),
      username: u.username || "",
      first_name: u.first_name || "",
      last_name: u.last_name || "",
      display_name: [u.first_name, u.last_name].filter(Boolean).join(" ") || u.username || ("user_" + u.id),
      photo_url: u.photo_url || "",
      premium: !!u.is_premium
    };
  }
  return getDevUser();
}

function initials(name){
  const parts = String(name || "P").trim().split(/\s+/).slice(0,2);
  return parts.map(x => x[0]?.toUpperCase() || "").join("") || "P";
}

function fillFromStartParam(){
  const qs = new URLSearchParams(location.search);

  const qGroupId = qs.get("group_id");
  const qRoomId = qs.get("room_id");
  const qGame = qs.get("game");

  if (qGroupId) el("groupIdInput").value = qGroupId;
  if (qRoomId) el("roomInput").value = qRoomId;
  if (qGame && ["ttt","memory","checkers"].includes(qGame)) {
    el("gameSelect").value = qGame;
  }

  const sp = state.startParam || "";

  if (sp.startsWith("r_")) {
    el("roomInput").value = sp.slice(2);
    return;
  }

  const prefixes = [
    ["ttt_g_", "ttt"],
    ["memory_g_", "memory"],
    ["checkers_g_", "checkers"],
    ["all_g_", null],
    ["g_", null]
  ];

  for (const [prefix, game] of prefixes) {
    if (sp.startsWith(prefix)) {
      const gid = sp.slice(prefix.length);
      el("groupIdInput").value = gid;
      if (game) el("gameSelect").value = game;
      return;
    }
  }
}

function setStatus(txt){
  el("status").innerHTML = txt;
}

function renderPlayers(room){
  const root = el("players");
  const players = room?.players || [];
  root.innerHTML = players.map((p, idx) => {
    const photo = p.photo_url
      ? `<img class="avatar" src="${h(p.photo_url)}" alt="">`
      : `<div class="avatar ph">${h(initials(p.display_name || p.first_name || "P"))}</div>`;

    const role =
      room.game === "checkers" ? (idx === 0 ? "Red" : "Black") :
      room.game === "ttt" ? (idx === 0 ? "X" : "O") :
      (idx === 0 ? "Player 1" : "Player 2");

    return `
      <div class="player">
        ${photo}
        <div style="min-width:0">
          <div style="font-weight:700">${h(p.display_name || p.first_name || ("user_"+p.id))}</div>
          <div class="small muted mono">${h(String(p.id))}${p.username ? " • @" + h(p.username) : ""}</div>
          <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">
            <span class="pill">${h(role)}</span>
            ${p.premium ? `<span class="pill">Premium</span>` : ``}
          </div>
        </div>
      </div>
    `;
  }).join("") || `<div class="muted">No players yet.</div>`;
}

function renderMeta(room){
  el("roomMeta").innerHTML = room ? `
    Room: <span class="mono">${h(room.room_id)}</span> •
    Group: <span class="mono">${h(String(room.group_id || ""))}</span> •
    Game: <b>${h(room.game)}</b> •
    Status: <b>${h(room.status)}</b>
  ` : "";
}

function renderChat(room){
  const box = el("chatBox");
  const msgs = room?.chat || [];
  box.innerHTML = msgs.map(m => `
    <div class="msg ${Number(m.user_id) === Number(state.me?.id) ? "me":""}">
      <div class="small"><b>${h(m.display_name || ("user_"+m.user_id))}</b> <span class="muted mono">${h(String(m.user_id))}</span></div>
      <div>${h(m.text)}</div>
    </div>
  `).join("");
  box.scrollTop = box.scrollHeight;
}

function myPlayerIndex(room){
  return (room.players || []).findIndex(p => Number(p.id) === Number(state.me.id));
}

function renderTtt(room){
  const s = room.state || {};
  const board = s.board || Array(9).fill(".");
  const root = document.createElement("div");
  root.className = "grid3";

  board.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    b.textContent = v === "." ? "·" : v;
    b.disabled = room.status !== "playing" || v !== ".";
    b.onclick = () => sendGameAction({ cell: i });
    root.appendChild(b);
  });

  const meIdx = myPlayerIndex(room);
  const mySide = meIdx === 0 ? "X" : meIdx === 1 ? "O" : "?";
  setStatus(`Turn: <b>${h(s.turn || "?")}</b> • Your side: <b>${h(mySide)}</b> ${s.winner ? "• Winner: <b>"+h(String(s.winner))+"</b>" : ""}`);
  return root;
}

function renderMemory(room){
  const s = room.state || {};
  const tiles = s.tiles || [];
  const root = document.createElement("div");
  root.className = "grid4";

  tiles.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "mem";
    b.textContent = t.matched ? "✅" : t.revealed ? t.value : "🟦";
    b.disabled = room.status !== "playing" || t.matched || (s.lock_until && s.lock_until > nowTs());
    b.onclick = () => sendGameAction({ index: i });
    root.appendChild(b);
  });

  const meIdx = myPlayerIndex(room);
  const scores = s.scores || [0,0];
  const turnText = (s.turn === 0 ? "Player 1" : "Player 2");
  setStatus(`Turn: <b>${h(turnText)}</b> • You: <b>${h(meIdx === 0 ? "Player 1" : meIdx === 1 ? "Player 2" : "?")}</b> • Score ${scores[0]}:${scores[1]} ${s.winner !== null && s.winner !== undefined ? "• Winner: <b>"+h(String(s.winner))+"</b>" : ""}`);
  return root;
}

function renderCheckers(room){
  const s = room.state || {};
  const board = s.board || Array.from({length:8},()=>Array(8).fill("."));
  const selected = s.selected;
  const targets = s.valid_targets || [];
  const root = document.createElement("div");
  root.className = "grid8";

  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const idx = r*8+c;
      const dark = ((r+c)%2===1);
      const sq = document.createElement("button");
      sq.className = `sq ${dark ? "dark":"light"} ${selected===idx ? "sel":""} ${targets.includes(idx) ? "target":""}`;
      const v = board[r][c];
      sq.textContent = ({ ".":"", "r":"🔴", "R":"❤️", "b":"⚫️", "B":"🖤" })[v] ?? "";
      sq.onclick = () => {
        if (targets.includes(idx)) sendGameAction({ type:"checkers_move", index:idx });
        else sendGameAction({ type:"checkers_select", index:idx });
      };
      root.appendChild(sq);
    }
  }

  const meIdx = myPlayerIndex(room);
  const mySide = meIdx === 0 ? "R" : meIdx === 1 ? "B" : "?";
  setStatus(`Turn: <b>${h(s.turn || "?")}</b> • Your side: <b>${h(mySide)}</b> ${s.winner ? "• Winner: <b>"+h(String(s.winner))+"</b>" : ""}`);
  return root;
}

function renderGame(room){
  el("gameTitle").textContent = ({
    ttt:"❌⭕ Tic-Tac-Toe",
    memory:"🧠 Memory Match",
    checkers:"🔴⚫ Checkers"
  })[room.game] || "Game";

  const wrap = el("boardWrap");
  wrap.innerHTML = "";

  if (!room) return;
  if (room.game === "ttt") wrap.appendChild(renderTtt(room));
  if (room.game === "memory") wrap.appendChild(renderMemory(room));
  if (room.game === "checkers") wrap.appendChild(renderCheckers(room));
}

async function refreshRoom(){
  if (!state.room?.room_id) return;
  const room = await api(`/api/room/state?room_id=${encodeURIComponent(state.room.room_id)}`);
  state.room = room.room;
  renderAll();
}

function startPolling(){
  stopPolling();
  state.pollTimer = setInterval(() => refreshRoom().catch(console.error), 1200);
}

function stopPolling(){
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = null;
}

function renderAll(){
  renderMeta(state.room);
  renderPlayers(state.room);
  renderChat(state.room);
  if (state.room) renderGame(state.room);
}

async function createRoom(){
  const game = el("gameSelect").value;
  const groupId = el("groupIdInput").value.trim();

  const res = await api("/api/room/create", {
    method:"POST",
    body: JSON.stringify({
      group_id: groupId ? Number(groupId) : null,
      game,
      user: state.me,
      start_param: state.startParam || ""
    })
  });

  state.room = res.room;
  el("roomInput").value = res.room.room_id;
  renderAll();
  startPolling();
}

async function joinRoom(){
  const roomId = el("roomInput").value.trim();
  if (!roomId) throw new Error("Enter room id");

  const res = await api("/api/room/join", {
    method:"POST",
    body: JSON.stringify({
      room_id: roomId,
      user: state.me,
      start_param: state.startParam || ""
    })
  });

  state.room = res.room;
  renderAll();
  startPolling();
}

async function sendChat(){
  if (!state.room?.room_id) throw new Error("Join a room first");
  const text = el("chatInput").value.trim();
  if (!text) return;

  await api("/api/room/chat", {
    method:"POST",
    body: JSON.stringify({
      room_id: state.room.room_id,
      user: state.me,
      text
    })
  });

  el("chatInput").value = "";
  await refreshRoom();
}

async function sendGameAction(action){
  if (!state.room?.room_id) throw new Error("Join a room first");

  await api("/api/room/action", {
    method:"POST",
    body: JSON.stringify({
      room_id: state.room.room_id,
      user: state.me,
      action
    })
  });

  await refreshRoom();
}

function copyRoomLink(){
  if (!state.room?.room_id) {
    alert("Create or join a room first");
    return;
  }

  const url = new URL(location.href);
  url.searchParams.set("room_id", state.room.room_id);
  url.searchParams.set("startapp", "r_" + state.room.room_id);
  if (state.apiBase) url.searchParams.set("api", state.apiBase);

  navigator.clipboard.writeText(url.toString()).then(() => {
    if (tg?.showPopup) tg.showPopup({title:"Copied", message:"Room link copied"});
    else alert("Room link copied");
  });
}

async function testApiHealth(){
  if (!state.apiBase) {
    setApiStatus();
    return;
  }

  try {
    const res = await fetch(state.apiBase + "/api/health");
    const raw = await res.text();
    let j = {};
    try { j = raw ? JSON.parse(raw) : {}; } catch(e) {}
    if (!res.ok) throw new Error("HTTP " + res.status);
    el("apiError").textContent = "";
    el("apiStatus").innerHTML = `Backend API: <span class="mono">${h(state.apiBase)}</span> • Health: OK`;
  } catch (e) {
    el("apiError").textContent = "Backend health check failed: " + e.message;
  }
}

function saveApiBase(){
  state.apiBase = normalizeBase(el("apiBaseInput").value);
  if (state.apiBase) localStorage.setItem(STORAGE_API_KEY, state.apiBase);
  else localStorage.removeItem(STORAGE_API_KEY);
  setApiStatus();
  testApiHealth().catch(console.error);
}

function init(){
  state.apiBase = resolveApiBase();
  state.me = getTelegramUser();
  state.startParam = getStartParam();

  setApiStatus();
  fillFromStartParam();

  el("btnSaveApi").onclick = saveApiBase;
  el("btnCreate").onclick = () => createRoom().catch(e => alert(e.message));
  el("btnJoin").onclick = () => joinRoom().catch(e => alert(e.message));
  el("btnRefresh").onclick = () => refreshRoom().catch(e => alert(e.message));
  el("btnSend").onclick = () => sendChat().catch(e => alert(e.message));
  el("btnShare").onclick = copyRoomLink;

  el("chatInput").addEventListener("keydown", ev => {
    if (ev.key === "Enter") sendChat().catch(console.error);
  });

  if (state.startParam?.startsWith("r_")) {
    joinRoom().catch(console.error);
  }

  renderPlayers({players:[state.me], game:"ttt"});
  el("roomMeta").textContent = state.startParam ? ("Start param: " + state.startParam) : "";
  testApiHealth().catch(console.error);
}

init();
</script>
</body>
</html>
